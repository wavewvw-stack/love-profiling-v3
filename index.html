<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恋愛プロファイリング Ver.3</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f9edf1;background:#140d17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#482138,#140d17 65%)}main{max-width:570px;margin:auto;padding:24px 17px 70px}header{text-align:center;margin:24px 0 30px}h1{font-size:29px;margin:6px 0}h2{font-size:23px;margin:8px 0 16px}.eyebrow{font-size:11px;letter-spacing:3px;color:#ffa6c3}.card{background:#281b2b;border:1px solid #624257;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 14px 30px #0002}.muted{color:#c5adbc;font-size:14px}.tag{display:inline-block;background:#6b2947;border-radius:99px;padding:5px 12px;font-size:12px;color:#ffd5e4}button,input,textarea,select{font:inherit}button{background:#ed568b;color:white;border:0;border-radius:13px;padding:13px 17px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#493345}input,textarea,select{width:100%;padding:13px;border-radius:12px;border:1px solid #76556b;background:#1b111e;color:white;margin:7px 0 13px}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.wide{width:100%}.answer{border:1px solid #77546b;background:#372338;border-radius:15px;padding:15px;margin:10px 0}.letter{font-weight:900;color:#ff93b6;font-size:19px;margin-right:8px}.score{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #634458}.error{color:#ff9f9f;min-height:22px}.center{text-align:center}.bigcode{font-size:36px;font-weight:900;letter-spacing:5px;color:#ff91b7}.progress{height:8px;border-radius:8px;background:#50364a;overflow:hidden}.progress div{height:100%;background:#ef6697}.result{color:#9ef0c5}.bad{color:#ffb4b4}small{color:#cbb4c1}
.rankrow{display:flex;align-items:center;gap:8px;margin:10px 0}.rankrow select{flex:1;margin:0}.pill{padding:5px 9px;background:#62334e;border-radius:9px}.loser{border:2px solid #f7a5c5;text-align:center}.line{white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px;color:#dcc4d2}.meter{height:7px;background:#513549;border-radius:8px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:#ec6296}.footer{font-size:12px;text-align:center;color:#a991a0;margin-top:24px}</style></head><body><main><header><div class="eyebrow">LOVE PROFILING ♡ VER.3</div><h1>そのセリフ、誰の仕業？</h1><div class="muted">性別だけ変えて、恋愛観は自分のまま。</div></header><div id="app"></div><p class="error center" id="error"></p><p class="footer">実演は任意。お酒も自分のペースで楽しもう。</p></main><script>
let session=null,state=null,source=null,draftRank=['','',''],draftGuess={};try{session=JSON.parse(localStorage.getItem('loveSessionV3')||'null')}catch{};
const el=document.getElementById('app'),letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(s){document.getElementById('error').textContent=s||''}
async function api(action,extra={}){error('');try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...session,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'エラー');if(d.id){session={code:d.code,id:d.id};localStorage.setItem('loveSessionV3',JSON.stringify(session));connect()}if(d.state){const changed=state&&(state.round!==d.state.round||state.phase!==d.state.phase);if(changed){draftRank=['','',''];draftGuess={}}state=d.state;render()}}catch(e){error(e.message)}}
function connect(){if(source)source.close();if(!session)return;source=new EventSource('/events?code='+encodeURIComponent(session.code)+'&id='+encodeURIComponent(session.id));source.onmessage=e=>{const s=JSON.parse(e.data);if(state&&(state.round!==s.round||state.phase!==s.phase)){draftRank=['','',''];draftGuess={}}state=s;render()};source.onerror=()=>error('再接続中です。しばらくお待ちください。')}
function btn(label,call,cls=''){return `<button class="${cls}" onclick="${call}">${label}</button>`}
function progress(n,total){return `<p class="muted">提出済み ${n} / ${total}人</p><div class="meter"><div style="width:${n/total*100}%"></div></div>`}
function answerCards(s,showOwner=false){return s.answers.map(a=>{const owner=s.players.find(p=>p.id===a.owner);return `<div class="answer"><span class="letter">${a.letter}</span><span class="line">${esc(a.text)}</span>${a.letter===s.me.ownLetter?' <small>（自分）</small>':''}${showOwner?`<p>→ <strong>${esc(owner.name)}</strong> <small>刺さり ${s.results.votes[owner.id]}点</small></p>`:''}</div>`}).join('')}
function render(){if(!state){el.innerHTML=`<div class="card"><h2>ルームに参加</h2><label>ニックネーム</label><input id="name" maxlength="16" placeholder="例：たろう"><label>参加コード</label><input id="code" maxlength="6" placeholder="友達の6桁コード"><div class="row">${btn('ルームを作る','join(true)')}${btn('コードで参加','join(false)','secondary')}</div></div>`;const code=new URLSearchParams(location.search).get('room');if(code)document.getElementById('code').value=code.toUpperCase();return}
const s=state,me=s.me,n=s.players.length,submitted=s.players.filter(p=>s.phase==='answer'?p.submitted:s.phase==='vote'?p.voted:p.guessed).length;
let html=`<div class="row between"><span class="tag">ROOM ${esc(s.code)}</span><span class="muted">${esc(me.name)} / ${n}人</span></div>`;
if(s.phase==='lobby'){html+=`<div class="card center"><div class="muted">参加コード</div><div class="bigcode">${esc(s.code)}</div><p class="muted">招待URLをLINEで共有</p>${btn('招待URLをコピー','copyInvite()','secondary wide')}</div><div class="card"><h2>参加メンバー</h2>${s.players.map(p=>`<div class="score">♡ ${esc(p.name)}</div>`).join('')}<p class="hint">4〜26人で参加可能。人数が多いと推理に時間がかかります。</p>${s.host?btn('ゲーム開始','api("start")','wide'):'<p class="muted">ホストが開始するまでお待ちください。</p>'}</div>`}
else if(s.phase==='answer'){html+=`<div class="card"><span class="tag">ROUND ${s.round+1} / ${s.total}　${esc(s.prompt[0])}視点</span><h2>${esc(s.prompt[1])}</h2><p>${esc(s.prompt[2])}</p><p class="hint">全員が「自分が${esc(s.prompt[0])}だったら」と考えて回答。性格は自分のまま。</p>${me.answer?`<div class="answer line">${esc(me.answer)}</div><p class="muted">全員の回答を待っています。</p>`:`<label>あなたなら何て言う？（100文字以内）</label><textarea id="answer" maxlength="100" placeholder="セリフを入力…"></textarea>${btn('匿名で回答する','submitAnswer()','wide')}`}${progress(submitted,n)}</div>`}
else if(s.phase==='vote'){const opts=s.answers.filter(a=>a.letter!==me.ownLetter);html+=`<div class="card"><span class="tag">ROUND ${s.round+1} — 刺さり投票</span><h2>一番刺さるのは誰のセリフ？</h2><p class="hint">自分以外からベスト3を選択。1位3点、2位2点、3位1点。誰の回答かはまだ秘密。</p>${answerCards(s)}</div>`;if(me.ballot){html+=`<div class="card center"><h2>投票完了！</h2>${progress(submitted,n)}</div>`}else{html+=`<div class="card"><h2>ベスト3投票</h2>${[0,1,2].map((i)=>`<div class="rankrow"><span class="pill">${i+1}位 ${3-i}点</span><select onchange="draftRank[${i}]=this.value"><option value="">回答を選択</option>${opts.map(a=>`<option value="${a.letter}" ${draftRank[i]===a.letter?'selected':''}>${a.letter}：${esc(a.text.slice(0,25))}</option>`).join('')}</select></div>`).join('')}${btn('投票を確定','submitVote()','wide')}</div>`}}
else if(s.phase==='guess'){const others=s.players.filter(p=>p.id!==me.id),opts=s.answers.filter(a=>a.letter!==me.ownLetter);html+=`<div class="card"><span class="tag">ROUND ${s.round+1} — 正体推理</span><h2>誰が書いた？</h2>${answerCards(s)}</div>`;if(me.guess){html+=`<div class="card center"><h2>推理完了！</h2>${progress(submitted,n)}</div>`}else{html+=`<div class="card"><h2>回答者を割り当てよう</h2><p class="hint">自分以外の${n-1}人に、重複なしで回答を割り当ててね。</p>${others.map(p=>`<label>${esc(p.name)}の回答は？</label><select onchange="draftGuess['${p.id}']=this.value"><option value="">選択してください</option>${opts.map(a=>`<option value="${a.letter}" ${draftGuess[p.id]===a.letter?'selected':''}>${a.letter}</option>`).join('')}</select>`).join('')}${btn('推理を確定','submitGuess()','wide')}</div>`}}
else if(s.phase==='reveal'){const loser=s.players.find(p=>p.id===s.results.loser);html+=`<div class="card"><span class="tag">ROUND ${s.round+1} — 正体公開</span><h2>答え合わせ ♡</h2>${answerCards(s,true)}<p class="result">あなたの推理：${s.results.correct[me.id]} / ${n-1}人正解</p></div><div class="card loser"><span class="tag">今回の実演担当</span><h2>${esc(loser.name)}！</h2><p>刺さり得点：${s.results.votes[loser.id]}点</p><div class="answer line">「${esc(s.answers.find(a=>a.owner===loser.id)?.text||'')}」</div><h3>自作セリフを全力実演！ 🎤</h3><p class="hint">実演は任意。パスもOK。</p></div>${leaderboard(s)}${s.host?`<div class="card">${btn(s.round+1===s.total?'最終結果へ':'次のお題へ','api("next")','wide')}</div>`:'<p class="center muted">ホストが次へ進めます。</p>'}`}
else if(s.phase==='finished'){html+=`<div class="card center"><span class="tag">FINISH</span><h2>最終ランキング ♡</h2><p>恋愛プロファイリング王、決定！</p></div>${leaderboard(s)}<div class="card">${btn('結果をコピー','copyResult()','wide')}</div>`}
el.innerHTML=html}
function leaderboard(s){return `<div class="card"><h2>総合ランキング</h2><p class="hint">推理は各問最大10点＋刺さり投票の獲得点</p>${[...s.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="score"><span>${['🥇','🥈','🥉'][i]||'♡'} ${esc(p.name)}</span><strong>${p.score.toFixed(1)}点</strong></div>`).join('')}</div>`}
function join(create){const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim().toUpperCase();if(!name)return error('名前を入力してください');if(!create&&!code)return error('参加コードを入力してください');api(create?'create':'join',{name,code})}
function submitAnswer(){api('answer',{text:document.getElementById('answer').value})}
function submitVote(){if(draftRank.some(x=>!x)||new Set(draftRank).size!==3)return error('異なる回答を1〜3位に選んでください');api('vote',{ranking:draftRank})}
function submitGuess(){const ids=state.players.filter(p=>p.id!==state.me.id).map(p=>p.id);if(ids.some(id=>!draftGuess[id])||new Set(ids.map(id=>draftGuess[id])).size!==ids.length)return error('全員の回答を重複なく選んでください');api('guess',{guess:draftGuess})}
function copyInvite(){navigator.clipboard.writeText(location.origin+'/?room='+state.code).then(()=>alert('招待URLをコピーしました')).catch(()=>error('コピーできませんでした'))}
function copyResult(){const text='恋愛プロファイリング結果\n'+[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`${i+1}位 ${p.name} ${p.score.toFixed(1)}点`).join('\n');navigator.clipboard.writeText(text).then(()=>alert('結果をコピーしました'))}
if(session){connect();api('state')}else render();
</script></body></html>
